name: zero-trace-image-edit
display_name: 改图无痕
display_name_en: Zero-Trace Image Edit
description: 一张图加一句话，把你想改的地方改掉，其余一点不动。支持移除、替换、添加、改色四类局部编辑，也能把 B/C 图的部件搬到 A 图。双闸门质检，出图必为真实结果，不出半成品。
description_zh: 指哪改哪的图片局部编辑：移除、替换、添加、改色，目标区域外像素零改动。
description_en: Point-and-fix local image editing: remove, replace, add or recolor one spot, leave the rest of the picture untouched.
keywords: 无痕改图,零痕改图,局部改图,图片局部编辑,指哪改哪,三图同改,指定区域改图,无痕去水印,无痕抠图,局部抠图,白底图局部改图,商品图局部改色,商品图零痕修图
